[Controller]
# Controller usage type (0 = Left and Right Joycon, 1 = Left Joycon, 2 = Right Joycon)
# 0 = Both Joy-Cons
# 1 = Left Joy-Con
# 2 = Right Joy-Con
controller = 0

# Controller grip
# Adds buttons depending on the controller grip
# 0 = vertical, 1 = horizontal (Only single Joy-Con)
orientation = 0

# Player LED indicator
# 0000 to 1111 in binary symbolizes four led lights
# 0 = Disabled, 1 = Enabled
led_player = 0001

# DSU Server (For motion controls)
# Not fully fonctional yet
# 0 = Disabled, 1 = Enabled
enable_dsu = 0

# Automatically save computer mac address
# No need anymore to press the sync button on the Joy-Con, it connects automatically on startup
# 0 = Disabled, 1 = Enabled
save_mac_address = 0

# Emulate mouse with Joy-Con
# Applied at startup for every pair; the GUI checkbox overrides it at runtime
# (ticking the box selects mode 1).
# 0 = Disabled
# 1 = Automatic: mouse mode while the Joy-Con is held against a surface
# 2 = Always: mouse mode regardless of the surface sensor. With two Joy-Cons
#     attached the left half drives the pointer.
mouse_mode = 0

# Pointer speed in mouse mode. 100 keeps the original feel, 200 is twice as
# fast, 50 half speed. Clamped to 10-400.
mouse_sensitivity = 100

# Lift-off distance for automatic mouse mode (mode 1). The Joy-Con reports a
# smaller distance the closer it is to a surface. Raise this if mouse mode
# refuses to engage on your desk; lower it if it engages while held in the air.
mouse_surface_threshold = 512

# Mouse output backend.
# auto     = use the WinUHid virtual HID mouse when its driver and DLLs are
#            present, otherwise SendInput (default)
# standard = SendInput only
# winuhid  = require the virtual HID mouse; warn and fall back if unavailable
# Only the virtual HID mouse is visible to games that read Raw Input (WM_INPUT).
# See the "Raw Input 鼠标" section of README.md for the driver setup.
mouse_output = auto

# HD Rumble amplitude (% of the built-in safe ceiling), 0-100
# Lower this if the vibration feels too strong or you hear a clicking sound.
rumble_strength = 100

# SL/SR button mappings (empty = unmapped)
# Available values: XUSB_GAMEPAD_A, XUSB_GAMEPAD_B, XUSB_GAMEPAD_X, XUSB_GAMEPAD_Y,
#                   XUSB_GAMEPAD_LEFT_SHOULDER, XUSB_GAMEPAD_RIGHT_SHOULDER,
#                   XUSB_GAMEPAD_LEFT_TRIGGER, XUSB_GAMEPAD_RIGHT_TRIGGER,
#                   XUSB_GAMEPAD_BACK, XUSB_GAMEPAD_START
sll_mapping = XUSB_GAMEPAD_RIGHT_SHOULDER
srl_mapping = 
slr_mapping = XUSB_GAMEPAD_X
srr_mapping = 

[Bluetooth]
# MAC address for auto-reconnect (12 hex characters)
# Format: XXXXXXXXXXXX (without spaces or colons)
# Doesn't work if save_mac_address is set to 0
mac_address = AABBCCDDEEFF

